<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat UI</title>
    <!-- Marked.js CDN for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        #chat { border: 1px solid #ccc; padding: 1rem; height: 400px; overflow-y: auto; margin-bottom: 1rem; border-radius: 8px; }
        .msg { margin: 0.5rem 0; padding: 0.75rem; border-radius: 8px; }
        .user { background: #eef6ff; text-align: right; }
        .ai { background: #f0f0f0; text-align: left; line-height: 1.5; }

        /* Ensure line breaks and Markdown spacing render correctly */
        .markdown-body { white-space: pre-wrap; word-break: break-word; }
        .markdown-body p { margin: 0.4rem 0; }
        .markdown-body ul, .markdown-body ol { padding-left: 1.2rem; margin: 0.4rem 0; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: 0.6rem 0 0.3rem 0; font-size: 1.1em; }

        input, button, textarea { padding: 0.5rem; font-size: 1rem; }
        button { margin-left: 0.5rem; cursor: pointer; }

        #msg { resize: none; overflow-y: hidden; min-height: 2.4rem; }

        .typing-dots span {
          display: inline-block;
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #888;
          animation: bounce 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-6px); }
        }

        #emptyState { text-align: center; padding: 2rem 0; }
        #emptyState p { font-size: 1.1rem; color: #555; }
        .chip {
          display: inline-block;
          padding: 0.4rem 0.8rem;
          margin: 0.25rem;
          border: 1px solid #ccc;
          border-radius: 999px;
          background: #f5f5f5;
          cursor: pointer;
        }
        .chip:hover { background: #e8e8e8; }

        #hint { font-size: 0.8rem; color: #777; margin: 0.25rem 0; }
        #stopBtn { display: none; }
    </style>
</head>
<body>
  <h2>🤖 AI Chat</h2>
  <div id="emptyState" hidden>
    <p>Ask your local model anything.</p>
    <div id="chips">
      <span class="chip">What is a black hole?</span>
      <span class="chip">Explain how recursion works.</span>
      <span class="chip">Give me a haiku about the sea.</span>
    </div>
  </div>
  <div id="chat"></div>
  <p id="hint">Enter to send, Shift+Enter for newline.</p>
  <form id="form" style="display:flex;">
    <textarea id="msg" placeholder="Ask something..." rows="1" style="flex:1;" required></textarea>
    <button type="submit">Send</button>
    <button type="button" id="stopBtn">Stop</button>
    <button type="button" id="newChat">New Chat</button>
    <button type="button" id="clear">Clear</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('msg');
    const sendBtn = form.querySelector('button[type="submit"]');
    const stopBtn = document.getElementById('stopBtn');
    const emptyState = document.getElementById('emptyState');
    const chips = document.getElementById('chips');
    const STORAGE_KEY = 'ai-chat-history';
    const messages = [];
    let abortController;
    let regenBtn = null;

    function saveMessages() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    function appendStored(m) {
      appendMessage(m.role === 'user' ? 'user' : 'ai', m.content, m.thinking || '');
    }

    function loadMessages() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) {
          parsed.forEach(m => {
            messages.push(m);
            appendStored(m);
          });
        }
      }
    }

    function resetChat() {
      messages.length = 0;
      chat.innerHTML = '';
      localStorage.removeItem(STORAGE_KEY);
      emptyState.hidden = false;
    }

    loadMessages();
    emptyState.hidden = messages.length > 0;

    function appendMessage(role, text, reasoning = '') {
      const div = document.createElement('div');
      div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;

      if (role === 'ai') {
        if (reasoning) {
          const thinkDiv = document.createElement('details');
          thinkDiv.style.marginBottom = '0.5rem';
          const cleanReasoning = DOMPurify.sanitize(marked.parse(reasoning));
          thinkDiv.innerHTML = `
            <summary style="cursor:pointer; color:#666; font-size:0.85em;">🧠 Thinking Process...</summary>
            <div class="markdown-body" style="margin-top:0.5rem; padding:0.8rem; background:#ffffff; border-radius:6px; font-size:0.9em; color:#444;">${cleanReasoning}</div>
          `;
          div.appendChild(thinkDiv);
        }

        const ansDiv = document.createElement('div');
        const clean = text && text.trim() ? DOMPurify.sanitize(marked.parse(text)) : '<em>(No text generated)</em>';
        ansDiv.innerHTML = `<div class="markdown-body">${clean}</div>`;
        div.appendChild(ansDiv);
      } else {
        div.textContent = text;
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function showTypingIndicator() {
      const div = document.createElement('div');
      div.id = 'typingIndicator';
      div.className = 'msg ai';
      div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTypingIndicator() {
      const div = document.getElementById('typingIndicator');
      if (div) div.remove();
    }

    function setBusy(busy) {
      input.disabled = busy;
      sendBtn.disabled = busy;
      stopBtn.style.display = busy ? '' : 'none';
    }

    function autoExpand() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 5 * (1.5 * 16 + 16)) + 'px';
    }

    input.addEventListener('input', autoExpand);

    function addRegenerateButton(div) {
      if (regenBtn) regenBtn.remove();
      const btn = document.createElement('button');
      btn.textContent = 'Regenerate';
      btn.type = 'button';
      btn.addEventListener('click', () => {
        if (input.disabled) return;
        btn.remove();
        regenBtn = null;
        div.remove();
        messages.pop();
        sendRequest();
      });
      div.appendChild(btn);
      regenBtn = btn;
    }

    function sendRequest() {
      setBusy(true);
      showTypingIndicator();
      abortController = new AbortController();
      fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
        signal: abortController.signal
      }).then(res => res.json()).then(data => {
        hideTypingIndicator();
        setBusy(false);
        if (data.success) {
          messages.push({ role: 'assistant', content: data.answer, thinking: data.thinking || '' });
          const div = appendMessage('ai', data.answer, data.thinking || '');
          saveMessages();
          addRegenerateButton(div);
        } else {
          appendMessage('ai', `Error: ${data.error}`);
        }
      }).catch(err => {
        hideTypingIndicator();
        setBusy(false);
        if (err.name === 'AbortError') {
          appendMessage('ai', 'Stopped.');
        } else {
          appendMessage('ai', '❌ Error contacting server');
          console.error(err);
        }
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;

      messages.push({ role: 'user', content: msg });
      appendMessage('user', msg);
      input.value = '';
      autoExpand();
      emptyState.hidden = true;

      sendRequest();
    });

    stopBtn.addEventListener('click', () => {
      if (abortController) {
        abortController.abort();
      }
    });

    chips.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      input.value = chip.textContent;
      input.focus();
    });

    document.getElementById('newChat').addEventListener('click', resetChat);
    document.getElementById('clear').addEventListener('click', resetChat);
  </script>
</body>
</html>
